<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>CRUD Usuários com ApiService</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  
  <script src="/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      padding: 2em;
    }

    table {
      margin-top: 1em;
    }
  </style>
</head>

<body class="container">

  <h1 class="mb-4">Gerenciamento de Alunos</h1>

  <div class="card mb-3">
    <div class="card-header">
      Filtro de Aluno
    </div>
    <div class="card-body">
      <label for="txtFiltroAluno" class="form-label">Curso do Aluno</label>
      <input type="text" id="txtFiltroAluno" class="form-control" placeholder="Digite o ID Curso do Aluno" />
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header">
      Cadastro de Aluno
    </div>

    <div class="card-body">
      <div class="mb-3">
        <input type="number" id="txtId" class="form-control mb-2" placeholder="ID" />

        <input type="text" id="txtNomeAluno" class="form-control mb-2" placeholder="Nome" />

        <input type="number" id="txtIdCurso" class="form-control mb-2" placeholder="ID do Curso" />
      </div>
      
      <div class="mb-3 d-flex gap-2" id="divBotoes"></div>
      <div id="divResposta"></div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header">
      Lista de Alunos
    </div>
    <div class="card-body">
      <div id="divTabela"></div>
    </div>
  </div>

  <div class="modal fade" id="modalConfirm" tabindex="-1" aria-labelledby="modalConfirmLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalConfirmLabel">Confirmar Exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          Tem certeza que deseja excluir este aluno?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmDelete">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import ApiService from './ApiService.js';

    const divUsuario = document.getElementById("divUsuario");

    let userData = localStorage.getItem("userData");

    if (userData) {
      userData = JSON.parse(userData);
    } else {
      window.location.href = "login.html";
    }

    const token = userData.data.token;

    const api = new ApiService(token);

    let API_DATA;

    const txtId = document.getElementById("txtId");
    const txtNomeAluno = document.getElementById("txtNomeAluno");
    const txtIdCurso = document.getElementById("txtIdCurso");
    const divBotoes = document.getElementById("divBotoes");
    const divResposta = document.getElementById("divResposta");

    function createButton(text, className) {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.className = `btn ${className} flex-fill`;
      return btn;
    }

    const btnListar = createButton("Listar", "btn-primary");
    btnListar.onclick = async function btnListar_click() {
      listAll();
    };
    divBotoes.appendChild(btnListar);

    const btnCriar = createButton("Criar", "btn-success");
    btnCriar.onclick = async function btnCriar_click() {
      if (txtId.value.trim() == "") {
        divResposta.textContent = "ID inválido";
        divResposta.className = "alert alert-warning";
        return;
      }

      if (txtNomeAluno.value.trim() == "") {
        divResposta.textContent = "Nome inválido";
        divResposta.className = "alert alert-warning";
        return;
      }

      if (txtIdCurso.value.trim() == "") {
        divResposta.textContent = "ID do Curso inválido";
        divResposta.className = "alert alert-warning";
        return;
      }

      const objetoCriar = {
        "aluno": {
          "id_aluno": parseInt(txtId.value.trim()),
          "nomeAluno": txtNomeAluno.value.trim(),
          "id_curso": txtIdCurso.value.trim()
         }
      };

      const resposta = await api.post("/alunos", objetoCriar);
      if (resposta && resposta.success) {
        divResposta.textContent = "Aluno criado com sucesso.";
        divResposta.className = "alert alert-success";
      } else {
        divResposta.textContent = "Erro ao criar aluno. Verifique se o ID já existe.";
        divResposta.className = "alert alert-danger";
      }
      listAll();
    };
    divBotoes.appendChild(btnCriar);

    const btnAtualizar = createButton("Atualizar", "btn-warning");
    btnAtualizar.onclick = async function btnAtualizar_click() {
      const id = txtId.value.trim();
      if (!id) {
        divResposta.textContent = "Selecione um aluno para atualizar";
        divResposta.className = "alert alert-warning";
        return
      }
      const objetoAtualizar = {
        "aluno": {
          "id_aluno": parseInt(txtId.value.trim()),
          "nomeAluno": txtNomeAluno.value.trim(),
          "id_curso": txtIdCurso.value.trim() }
      };

      const resposta = await api.put("/alunos", id, objetoAtualizar);
      if (resposta && resposta.success) {
        divResposta.textContent = "Aluno atualizado com sucesso.";
        divResposta.className = "alert alert-success";
      } else {
        divResposta.textContent = "Erro ao atualizar aluno. Verifique se o ID existe.";
        divResposta.className = "alert alert-danger";
      }
      listAll();
    };
    divBotoes.appendChild(btnAtualizar);

    const btnExcluir = createButton("Excluir", "btn-danger");
    btnExcluir.onclick = function () {
      const id = txtId.value.trim();
      if (!id) {
        divResposta.textContent = "Selecione um aluno para excluir";
        divResposta.className = "alert alert-warning";
        return;
      }

      const modal = new bootstrap.Modal(document.getElementById('modalConfirm'));
      modal.show();

      const btnConfirmDelete = document.getElementById("btnConfirmDelete");
      btnConfirmDelete.onclick = async function () {
        const resultado = await api.delete("/alunos", id);
        if (resultado && resultado.success) {
          listAll();
          divResposta.textContent = `Aluno ID ${id} excluído com sucesso.`;
          divResposta.className = "alert alert-success";
          txtId.value = "";
          txtNomeAluno.value = "";
        } else {
          divResposta.textContent = "Erro ao excluir aluno. Ele pode estar vinculado a outros registros.";
          divResposta.className = "alert alert-danger";
        }
        modal.hide();
      };
        
      };

    divBotoes.appendChild(btnExcluir);

    async function listAll() {
      API_DATA = await api.get("/alunos");

      if (API_DATA.success == true) {
        renderTable(API_DATA);
      } else {
      }
    }

    function renderTable(dados) {
      const divTabela = document.getElementById("divTabela");
      divTabela.innerHTML = "";

      const table = document.createElement("table");
      table.className = "table table-bordered table-striped";

      const thead = document.createElement("thead");
      thead.className = "table-light";
      const trHead = document.createElement("tr");

      ["ID", "Nome Aluno", "ID Curso", "Ações"].forEach(text => {
        const th = document.createElement("th");
        th.textContent = text;
        trHead.appendChild(th);
      });

      thead.appendChild(trHead);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      dados.data.alunos.forEach(aluno => {
        const tr = document.createElement("tr");

        const tdId = document.createElement("td");
        tdId.textContent = aluno.id_aluno;
        tr.appendChild(tdId);

        const tdNome = document.createElement("td");
        tdNome.textContent = aluno.nomeAluno;
        tr.appendChild(tdNome);

        const tdCurso = document.createElement("td");
        tdCurso.textContent = aluno.id_curso;
        tr.appendChild(tdCurso);

        const tdAcoes = document.createElement("td");

        const divBotoes = document.createElement("div");
        divBotoes.className = "d-flex gap-2";

        const btnSel = createButton("Selecionar", "btn-info");
        btnSel.onclick = function () {
          txtId.value = aluno.id_aluno;
          txtNomeAluno.value = aluno.nomeAluno;
          txtIdCurso.value = aluno.id_curso;

          divResposta.textContent = "";
          divResposta.className = "";
        };
        divBotoes.appendChild(btnSel);

        tdAcoes.appendChild(divBotoes);
        tr.appendChild(tdAcoes);

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      divTabela.appendChild(table);
    }

    txtFiltroAluno.addEventListener("input", function () {
      const filtro = txtFiltroAluno.value.trim().toLowerCase();

      if (!API_DATA || !API_DATA.data || !API_DATA.data.alunos) return;

      const dadosFiltrados = {
        data: {
          alunos: API_DATA.data.alunos.filter(aluno =>
            String(aluno.id_curso).toLowerCase().includes(filtro)
          )
        }
      };

      renderTable(dadosFiltrados);

      txtId.value = "";
    });

    listAll();
  </script>
</body>
</html>
